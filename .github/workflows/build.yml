name: Validate PosVEN Pro Turso migration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Next.js server app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build application and Turso API routes
        run: npm run build
        env:
          # Credentials are runtime-only; never injected into NEXT_PUBLIC_* or client bundles.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Verify server build output
        run: |
          test -f .next/BUILD_ID
          echo "Next.js server build exists."
          if grep -R -n -E 'NEXT_PUBLIC_FIREBASE|firebase/auth|firebase/firestore|firebase/database' src next.config.ts package.json; then
            echo "Firebase references remain in operational source."
            exit 1
          fi
          echo "No Firebase operational imports found in checked source."

      - name: Commit reconciled dependency lockfile
        if: success() && github.ref == 'refs/heads/turso-only'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(lockfile): remove Firebase and lock Turso dependencies"
            git push
          fi
